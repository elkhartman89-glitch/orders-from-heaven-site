<!doctype html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Austin Vision</title>
  <style>
    :root {
      --navy: #1f2937;
      --navy-2: #111827;
      --gold: #c7922b;
      --red: #dc2626;
      --green: #15803d;
      --yellow: #d97706;
      --blue: #2563eb;
      --ink: #111827;
      --muted: #64748b;
      --line: #d8dee8;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --soft: #eef2f7;
      --shadow: 0 20px 45px rgba(15, 23, 42, 0.14);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: var(--bg);
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .header {
      min-height: 76px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      color: #fff;
      background: linear-gradient(135deg, var(--navy), var(--navy-2));
      border-bottom: 4px solid var(--gold);
    }

    .header img {
      max-width: 158px;
      max-height: 44px;
      object-fit: contain;
      background: #fff;
      border-radius: 6px;
      padding: 5px;
    }

    .header h1 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: 0.01em;
    }

    .header p {
      margin: 4px 0 0;
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.9rem;
    }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(390px, 33vw) minmax(0, 1fr);
    }

    .sidebar {
      min-height: 0;
      overflow: auto;
      padding: 14px;
      display: grid;
      gap: 12px;
      background: #eef2f7;
      border-right: 1px solid var(--line);
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 400px;
    }

    .panel {
      padding: 14px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
    }

    .panel h2 {
      margin: 0 0 10px;
      font-size: 1rem;
      color: var(--navy);
    }

    .grid {
      display: grid;
      gap: 9px;
    }

    .two { grid-template-columns: 1fr 1fr; }

    label {
      display: grid;
      gap: 5px;
      color: #334155;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    input, select, textarea {
      width: 100%;
      min-height: 38px;
      padding: 8px 10px;
      color: var(--ink);
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
      text-transform: none;
    }

    textarea {
      min-height: 78px;
      resize: vertical;
    }

    button {
      min-height: 38px;
      padding: 8px 11px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
      color: var(--navy);
      font-weight: 800;
      cursor: pointer;
    }

    button:hover { border-color: var(--gold); }
    button.primary { color: #fff; background: var(--navy); border-color: var(--navy); }
    button.gold { color: #111827; background: #f8d98a; border-color: #d8a534; }
    button.danger { color: #fff; background: #b91c1c; border-color: #991b1b; }
    button.full { width: 100%; }

    .small-muted {
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.4;
    }

    .status-line {
      padding: 8px 10px;
      border-radius: 8px;
      color: #334155;
      background: var(--soft);
      font-size: 0.84rem;
      line-height: 1.35;
    }

    .list {
      display: grid;
      gap: 10px;
      max-height: 460px;
      overflow: auto;
      padding-right: 2px;
    }

    .card {
      padding: 12px;
      display: grid;
      gap: 8px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.07);
    }

    .card h3 {
      margin: 0;
      font-size: 0.98rem;
      color: var(--navy);
    }

    .card p { margin: 0; line-height: 1.35; }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .badge {
      min-height: 24px;
      padding: 4px 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      color: #fff;
      background: #64748b;
      font-size: 0.72rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .badge.hot { background: var(--red); }
    .badge.warm { background: var(--yellow); }
    .badge.cold { background: #475569; }
    .badge.review { background: #334155; }
    .badge.new { background: var(--green); }

    .fit-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px 8px;
      font-size: 0.78rem;
      color: #334155;
    }

    .actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .saved-controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
      align-items: start;
    }

    .empty {
      padding: 12px;
      color: var(--muted);
      background: #fff;
      border: 1px dashed #cbd5e1;
      border-radius: 10px;
      line-height: 1.4;
    }

    @media (max-width: 920px) {
      body { overflow: auto; }
      .app { min-height: 100vh; height: auto; }
      .workspace { grid-template-columns: 1fr; }
      .sidebar { max-height: none; overflow: visible; }
      #map { height: 70vh; }
      .two, .saved-controls { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <? if (logoUrl) { ?>
        <img src="<?= logoUrl ?>" alt="Austin Hardware logo">
      <? } ?>
      <div>
        <h1>Austin Vision</h1>
        <p>OEM, VMI, hardware, fastener, chemical, and engineering-service prospecting tool.</p>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar">
        <section class="panel">
          <h2>Sales Rep Location</h2>
          <div class="grid">
            <label>Sales Rep Name<input id="repName" placeholder="Enter rep name"></label>
            <label>Search Radius
              <select id="radiusMiles">
                <option value="10">10 miles</option>
                <option value="25" selected>25 miles</option>
                <option value="50">50 miles</option>
              </select>
            </label>
            <button class="primary full" id="useLocationBtn" type="button">Use My Current Location</button>
            <div class="status-line" id="repStatus">Rep location not set.</div>
          </div>
        </section>

        <section class="panel">
          <h2>Nearby Prospect Search</h2>
          <div class="grid">
            <button class="gold full" id="searchBtn" type="button">Find OEM / VMI Targets Near Me</button>
            <div class="status-line" id="searchStatus">Search requires rep location first. Places results are candidates, not guaranteed customers.</div>
            <div id="candidateList" class="list"></div>
          </div>
        </section>

        <section class="panel">
          <h2>Manual Prospect Entry</h2>
          <form id="manualForm" class="grid">
            <label>Company Name<input id="manualCompany" required></label>
            <label>Contact Name<input id="manualContact"></label>
            <label>Industry<input id="manualIndustry"></label>
            <label>Address<input id="manualAddress" required></label>
            <div class="grid two">
              <label>City<input id="manualCity"></label>
              <label>State<input id="manualState"></label>
            </div>
            <div class="grid two">
              <label>ZIP<input id="manualZip"></label>
              <label>Phone<input id="manualPhone"></label>
            </div>
            <div class="grid two">
              <label>Email<input id="manualEmail" type="email"></label>
              <label>Website<input id="manualWebsite" type="url"></label>
            </div>
            <label>Product Interest<input id="manualProductInterest" placeholder="Fasteners, VMI, chemicals, engineering"></label>
            <label>Status
              <select id="manualStatus">
                <option>New</option>
                <option>Candidate Review</option>
                <option>Contacted</option>
                <option>Quoted</option>
                <option>Won</option>
                <option>Lost</option>
              </select>
            </label>
            <label>Notes<textarea id="manualNotes"></textarea></label>
            <button class="primary" type="submit">Save Manual Prospect</button>
          </form>
        </section>

        <section class="panel">
          <h2>Saved Prospects</h2>
          <div class="grid">
            <label>Status Filter
              <select id="savedStatusFilter">
                <option value="">All statuses</option>
                <option>New</option>
                <option>Candidate Review</option>
                <option>Contacted</option>
                <option>Quoted</option>
                <option>Won</option>
                <option>Lost</option>
              </select>
            </label>
            <button id="refreshSavedBtn" type="button">Refresh Saved Prospects</button>
            <div id="savedList" class="list"></div>
          </div>
        </section>
      </aside>

      <main id="map" aria-label="Austin Vision prospecting map"></main>
    </div>
  </div>

  <script>
    var map;
    var geocoder;
    var infoWindow;
    var repMarker;
    var candidateMarkers = [];
    var savedMarkers = [];
    var currentCandidates = [];
    var savedProspects = [];
    var rep = { name: '', lat: null, lng: null };

    function initMap() {
      map = new google.maps.Map(document.getElementById('map'), {
        center: { lat: 39.8283, lng: -98.5795 },
        zoom: 5,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true
      });
      geocoder = new google.maps.Geocoder();
      infoWindow = new google.maps.InfoWindow();
      bindEvents();
      loadSavedProspects();
    }

    function bindEvents() {
      document.getElementById('useLocationBtn').addEventListener('click', useCurrentLocation);
      document.getElementById('searchBtn').addEventListener('click', searchNearRep);
      document.getElementById('manualForm').addEventListener('submit', saveManualProspect);
      document.getElementById('refreshSavedBtn').addEventListener('click', loadSavedProspects);
      document.getElementById('savedStatusFilter').addEventListener('change', renderSavedProspects);

      document.getElementById('candidateList').addEventListener('click', function(event) {
        var button = event.target.closest('button[data-action]');
        if (!button) return;
        var index = Number(button.getAttribute('data-index'));
        var candidate = currentCandidates[index];
        if (!candidate) return;
        if (button.getAttribute('data-action') === 'add') saveCandidate(candidate);
        if (button.getAttribute('data-action') === 'view') viewCandidate(candidate);
      });

      document.getElementById('savedList').addEventListener('click', function(event) {
        var button = event.target.closest('button[data-action]');
        if (!button) return;
        var id = button.getAttribute('data-id');
        var prospect = findSavedProspect(id);
        if (!prospect) return;
        var action = button.getAttribute('data-action');
        if (action === 'view') viewSavedProspect(prospect);
        if (action === 'delete') deleteSavedProspect(prospect);
        if (action === 'update') updateSavedProspect(prospect);
      });
    }

    function useCurrentLocation() {
      if (!navigator.geolocation) {
        alert('Browser geolocation is not available.');
        return;
      }
      setStatus('repStatus', 'Getting browser location...');
      navigator.geolocation.getCurrentPosition(function(position) {
        rep.name = document.getElementById('repName').value.trim();
        rep.lat = position.coords.latitude;
        rep.lng = position.coords.longitude;
        setRepMarker();
        setStatus('repStatus', 'Rep location set: ' + formatNumber(rep.lat) + ', ' + formatNumber(rep.lng));
      }, function(error) {
        setStatus('repStatus', 'Could not get location: ' + error.message);
        alert('Could not get your current location: ' + error.message);
      }, { enableHighAccuracy: true, timeout: 15000 });
    }

    function setRepMarker() {
      var position = { lat: Number(rep.lat), lng: Number(rep.lng) };
      if (repMarker) repMarker.setMap(null);
      repMarker = new google.maps.Marker({
        map: map,
        position: position,
        title: 'Sales rep location',
        icon: circleIcon('#2563eb', 11)
      });
      map.setCenter(position);
      map.setZoom(11);
    }

    function searchNearRep() {
      if (!rep.lat || !rep.lng) {
        alert('Use My Current Location before searching.');
        return;
      }
      rep.name = document.getElementById('repName').value.trim();
      var radius = document.getElementById('radiusMiles').value;
      setStatus('searchStatus', 'Searching Google Places for industrial/OEM prospects...');
      document.getElementById('candidateList').innerHTML = '<div class="empty">Searching. This can take a moment because multiple industrial queries are being vetted.</div>';
      google.script.run
        .withSuccessHandler(function(result) {
          currentCandidates = result.candidates || [];
          setStatus('searchStatus', 'Found ' + currentCandidates.length + ' vetted candidates from ' + (result.searchedQueries || []).length + ' industrial searches.');
          renderCandidates();
          renderCandidateMarkers();
        })
        .withFailureHandler(function(error) {
          setStatus('searchStatus', 'Search failed.');
          alert(serverError(error));
        })
        .findAustinProspectsNearRep({ name: rep.name, lat: rep.lat, lng: rep.lng }, radius);
    }

    function renderCandidates() {
      var list = document.getElementById('candidateList');
      if (!currentCandidates.length) {
        list.innerHTML = '<div class="empty">No vetted OEM/VMI candidates returned. Try a larger radius or a different rep location.</div>';
        return;
      }
      list.innerHTML = currentCandidates.map(function(candidate, index) {
        return '<article class="card">' +
          '<div class="badges"><span class="badge ' + priorityClass(candidate.targetPriority) + '">' + escapeHtml(candidate.targetPriority) + '</span><span class="badge review">Score ' + escapeHtml(candidate.leadScore) + '</span></div>' +
          '<h3>' + escapeHtml(candidate.name) + '</h3>' +
          '<p class="small-muted">' + escapeHtml(candidate.address || 'No address returned') + '</p>' +
          '<p class="small-muted">Phone: ' + escapeHtml(candidate.phone || '-') + ' | Distance: ' + escapeHtml(candidate.distanceMiles || '-') + ' mi</p>' +
          websiteLink(candidate.website) +
          '<p><strong>Vetting:</strong> ' + escapeHtml(candidate.vettingStatus || '') + '</p>' +
          fitGrid(candidate) +
          '<div class="actions"><button class="primary" data-action="add" data-index="' + index + '">Add to Prospect List</button><button data-action="view" data-index="' + index + '">View on Map</button></div>' +
        '</article>';
      }).join('');
    }

    function renderCandidateMarkers() {
      clearMarkers(candidateMarkers);
      candidateMarkers = currentCandidates
        .filter(function(candidate) { return candidate.lat && candidate.lng; })
        .map(function(candidate) {
          var marker = new google.maps.Marker({
            map: map,
            position: { lat: Number(candidate.lat), lng: Number(candidate.lng) },
            title: candidate.name,
            icon: circleIcon(candidate.targetPriority === 'Hot' ? '#dc2626' : '#d97706', 9)
          });
          marker.addListener('click', function() { openCandidateInfo(candidate, marker); });
          return marker;
        });
    }

    function saveCandidate(candidate) {
      google.script.run
        .withSuccessHandler(function() {
          alert('Prospect saved.');
          loadSavedProspects();
        })
        .withFailureHandler(function(error) { alert(serverError(error)); })
        .addAustinVettedProspect(candidate, rep);
    }

    function saveManualProspect(event) {
      event.preventDefault();
      var address = [value('manualAddress'), value('manualCity'), value('manualState'), value('manualZip')].filter(Boolean).join(', ');
      if (!value('manualCompany')) {
        alert('Company Name is required.');
        return;
      }
      geocoder.geocode({ address: address }, function(results, status) {
        if (status !== 'OK' || !results || !results[0]) {
          alert('Could not geocode manual address: ' + status);
          return;
        }
        var location = results[0].geometry.location;
        var prospect = {
          companyName: value('manualCompany'),
          contactName: value('manualContact'),
          industry: value('manualIndustry'),
          address: value('manualAddress'),
          city: value('manualCity'),
          state: value('manualState'),
          zip: value('manualZip'),
          phone: value('manualPhone'),
          email: value('manualEmail'),
          website: value('manualWebsite'),
          productInterest: value('manualProductInterest'),
          status: value('manualStatus'),
          notes: value('manualNotes'),
          lat: location.lat(),
          lng: location.lng(),
          salesRep: rep.name || value('repName'),
          repLat: rep.lat || '',
          repLng: rep.lng || '',
          distanceMiles: rep.lat && rep.lng ? distanceMiles(rep.lat, rep.lng, location.lat(), location.lng()) : '',
          source: 'Manual Entry'
        };
        google.script.run
          .withSuccessHandler(function() {
            alert('Manual prospect saved.');
            document.getElementById('manualForm').reset();
            loadSavedProspects();
          })
          .withFailureHandler(function(error) { alert(serverError(error)); })
          .addProspect(prospect);
      });
    }

    function loadSavedProspects() {
      google.script.run
        .withSuccessHandler(function(prospects) {
          savedProspects = prospects || [];
          renderSavedProspects();
          renderSavedMarkers();
        })
        .withFailureHandler(function(error) {
          document.getElementById('savedList').innerHTML = '<div class="empty">' + escapeHtml(serverError(error)) + '</div>';
        })
        .getProspects();
    }

    function renderSavedProspects() {
      var filter = document.getElementById('savedStatusFilter').value;
      var filtered = savedProspects.filter(function(prospect) { return !filter || prospect.Status === filter; });
      var list = document.getElementById('savedList');
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">No saved prospects match this filter.</div>';
        return;
      }
      list.innerHTML = filtered.map(function(prospect) {
        var id = escapeAttr(prospect.ID);
        return '<article class="card">' +
          '<div class="badges"><span class="badge ' + priorityClass(prospect['Target Priority']) + '">' + escapeHtml(prospect['Target Priority'] || '-') + '</span><span class="badge ' + statusClass(prospect.Status) + '">' + escapeHtml(prospect.Status || '-') + '</span><span class="badge review">Score ' + escapeHtml(prospect['Lead Score'] || '0') + '</span></div>' +
          '<h3>' + escapeHtml(prospect['Company Name']) + '</h3>' +
          '<p class="small-muted">' + escapeHtml([prospect.Address, prospect.City, prospect.State, prospect.ZIP].filter(Boolean).join(', ')) + '</p>' +
          '<p class="small-muted">Industry: ' + escapeHtml(prospect.Industry || '-') + ' | Interest: ' + escapeHtml(prospect['Product Interest'] || '-') + '</p>' +
          '<p class="small-muted">Rep: ' + escapeHtml(prospect['Sales Rep'] || '-') + ' | Distance: ' + escapeHtml(prospect['Distance Miles'] || '-') + ' mi</p>' +
          '<div class="saved-controls"><select data-field="status" data-id="' + id + '">' + statusOptions(prospect.Status) + '</select><button data-action="update" data-id="' + id + '">Update</button></div>' +
          '<textarea data-field="notes" data-id="' + id + '" placeholder="Notes">' + escapeHtml(prospect.Notes || '') + '</textarea>' +
          '<div class="actions"><button data-action="view" data-id="' + id + '">View on Map</button><button class="danger" data-action="delete" data-id="' + id + '">Delete</button></div>' +
        '</article>';
      }).join('');
    }

    function updateSavedProspect(prospect) {
      var id = prospect.ID;
      var status = document.querySelector('select[data-field="status"][data-id="' + cssEscape(id) + '"]').value;
      var notes = document.querySelector('textarea[data-field="notes"][data-id="' + cssEscape(id) + '"]').value;
      google.script.run
        .withSuccessHandler(function() {
          alert('Prospect updated.');
          loadSavedProspects();
        })
        .withFailureHandler(function(error) { alert(serverError(error)); })
        .updateProspect(id, { Status: status, Notes: notes });
    }

    function deleteSavedProspect(prospect) {
      if (!confirm('Delete prospect "' + prospect['Company Name'] + '"?')) return;
      google.script.run
        .withSuccessHandler(function() {
          alert('Prospect deleted.');
          loadSavedProspects();
        })
        .withFailureHandler(function(error) { alert(serverError(error)); })
        .deleteProspect(prospect.ID);
    }

    function renderSavedMarkers() {
      clearMarkers(savedMarkers);
      savedMarkers = savedProspects
        .filter(function(prospect) { return prospect.Latitude && prospect.Longitude; })
        .map(function(prospect) {
          var marker = new google.maps.Marker({
            map: map,
            position: { lat: Number(prospect.Latitude), lng: Number(prospect.Longitude) },
            title: prospect['Company Name'],
            icon: circleIcon(prospect['Target Priority'] === 'Hot' ? '#dc2626' : '#15803d', 8)
          });
          marker.addListener('click', function() { openSavedInfo(prospect, marker); });
          return marker;
        });
    }

    function viewCandidate(candidate) {
      if (!candidate.lat || !candidate.lng) return;
      map.panTo({ lat: Number(candidate.lat), lng: Number(candidate.lng) });
      map.setZoom(13);
      var marker = candidateMarkers.find(function(item) { return item.getTitle() === candidate.name; });
      if (marker) openCandidateInfo(candidate, marker);
    }

    function viewSavedProspect(prospect) {
      if (!prospect.Latitude || !prospect.Longitude) return;
      map.panTo({ lat: Number(prospect.Latitude), lng: Number(prospect.Longitude) });
      map.setZoom(13);
      var marker = savedMarkers.find(function(item) { return item.getTitle() === prospect['Company Name']; });
      if (marker) openSavedInfo(prospect, marker);
    }

    function openCandidateInfo(candidate, marker) {
      infoWindow.setContent('<strong>' + escapeHtml(candidate.name) + '</strong><br>' + escapeHtml(candidate.targetPriority) + ' | Score ' + escapeHtml(candidate.leadScore) + '<br>' + fitLine(candidate) + '<br>' + escapeHtml(candidate.address || ''));
      infoWindow.open(map, marker);
    }

    function openSavedInfo(prospect, marker) {
      infoWindow.setContent('<strong>' + escapeHtml(prospect['Company Name']) + '</strong><br>Status: ' + escapeHtml(prospect.Status || '') + '<br>Priority: ' + escapeHtml(prospect['Target Priority'] || '') + '<br>' + escapeHtml(prospect['Product Interest'] || '') + '<br>' + escapeHtml(prospect.Address || ''));
      infoWindow.open(map, marker);
    }

    function fitGrid(candidate) {
      return '<div class="fit-grid">' +
        '<span>OEM Fit: ' + yesNo(candidate.oemFit) + '</span>' +
        '<span>VMI Fit: ' + yesNo(candidate.vmiFit) + '</span>' +
        '<span>Fastener Fit: ' + yesNo(candidate.fastenerFit) + '</span>' +
        '<span>Hardware Fit: ' + yesNo(candidate.hardwareFit) + '</span>' +
        '<span>Chemical Fit: ' + yesNo(candidate.chemicalFit) + '</span>' +
        '<span>Engineering Fit: ' + yesNo(candidate.engineeringFit) + '</span>' +
      '</div>';
    }

    function fitLine(candidate) {
      return 'OEM ' + yesNo(candidate.oemFit) + ' | VMI ' + yesNo(candidate.vmiFit) + ' | Fastener ' + yesNo(candidate.fastenerFit) + ' | Hardware ' + yesNo(candidate.hardwareFit) + ' | Chemical ' + yesNo(candidate.chemicalFit) + ' | Engineering ' + yesNo(candidate.engineeringFit);
    }

    function websiteLink(url) {
      var safe = safeUrl(url);
      if (!safe) return '<p class="small-muted">Website: -</p>';
      return '<p class="small-muted">Website: <a href="' + escapeAttr(safe) + '" target="_blank" rel="noopener">' + escapeHtml(safe) + '</a></p>';
    }

    function statusOptions(current) {
      var statuses = ['New', 'Candidate Review', 'Contacted', 'Quoted', 'Won', 'Lost'];
      return statuses.map(function(status) {
        return '<option ' + (status === current ? 'selected' : '') + '>' + escapeHtml(status) + '</option>';
      }).join('');
    }

    function clearMarkers(markers) {
      markers.forEach(function(marker) { marker.setMap(null); });
      markers.length = 0;
    }

    function circleIcon(color, scale) {
      return {
        path: google.maps.SymbolPath.CIRCLE,
        scale: scale,
        fillColor: color,
        fillOpacity: 1,
        strokeColor: '#ffffff',
        strokeWeight: 2
      };
    }

    function findSavedProspect(id) {
      return savedProspects.find(function(prospect) { return prospect.ID === id; });
    }

    function value(id) {
      return document.getElementById(id).value.trim();
    }

    function setStatus(id, text) {
      document.getElementById(id).textContent = text;
    }

    function priorityClass(value) {
      var text = String(value || '').toLowerCase();
      if (text === 'hot') return 'hot';
      if (text === 'warm') return 'warm';
      return 'cold';
    }

    function statusClass(value) {
      return String(value || '').toLowerCase() === 'new' ? 'new' : 'review';
    }

    function yesNo(value) {
      return value ? 'Yes' : 'No';
    }

    function safeUrl(url) {
      var text = String(url || '').trim();
      if (!text) return '';
      if (/^https?:\/\//i.test(text)) return text;
      return '';
    }

    function escapeHtml(value) {
      return String(value === null || value === undefined ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, '&#96;');
    }

    function cssEscape(value) {
      if (window.CSS && CSS.escape) return CSS.escape(value);
      return String(value).replace(/"/g, '\\"');
    }

    function serverError(error) {
      return error && error.message ? error.message : String(error || 'Unknown server error');
    }

    function formatNumber(value) {
      return Number(value).toFixed(5);
    }

    function distanceMiles(lat1, lon1, lat2, lon2) {
      var radius = 3958.7613;
      var dLat = toRad(lat2 - lat1);
      var dLon = toRad(lon2 - lon1);
      var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
      var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(radius * c * 10) / 10;
    }

    function toRad(value) {
      return value * Math.PI / 180;
    }
  </script>
  <script async defer src="https://maps.googleapis.com/maps/api/js?key=<?!= mapsApiKey ?>&callback=initMap"></script>
</body>
